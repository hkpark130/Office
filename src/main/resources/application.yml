# keycloak
spring:
  config:
    activate:
      on-profile: local
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${constants.keycloak-url}/realms/${constants.realm}
      client:
        provider:
          keycloak:
            issuer-uri: ${constants.keycloak-url}/realms/${constants.realm}
            user-name-attribute: preferred_username
        registration:
          keycloak:
            provider: keycloak
            client-name: back-office-api
            client-id: back-office-api
            client-secret: ${constants.client-secret}
            scope: openid,offline_access,profile
            authorization-grant-type: authorization_code
#            redirect-uri: ${constants.keycloakUrl}/login/oauth2/code/external
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    show_sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        default_batch_fetch_size: 1000
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
      path: /h2-console

